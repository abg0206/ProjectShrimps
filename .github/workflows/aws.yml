name: Deploy to EC2

on:
  push:
    branches: ['main']

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /path/to/ProjectShrimps

            git fetch origin main
            git reset --hard origin/main

            npm ci --prefix Backend --omit=dev
            npm ci --prefix Frontend
            npm run build --prefix Frontend

            # Run pending DB migrations before restarting the app.
            # This step exits non-zero (failing the deploy) if a migration fails,
            # so a broken schema change never reaches the running app.
            npm run migrate --prefix Backend -- --env production

            pm2 restart backend --update-env
            pm2 restart frontend --update-env

      - name: Health check
        run: |
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.HEALTHCHECK_URL }}")
            if [ "$STATUS" -eq 200 ]; then
              echo "Healthy"
              exit 0
            fi
            echo "Attempt $i: got HTTP $STATUS, retrying..."
            sleep 5
          done
          echo "Health check failed after deploy"
          exit 1